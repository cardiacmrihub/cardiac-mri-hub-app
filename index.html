<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cardiac MRI Hub</title>
  <meta name="description" content="Step-by-step cardiac MRI planning guides for technologists, with offline reading at the scanner.">
  <!--PAGE-META-->
  <meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141C24" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cardiac MRI">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar" id="topbar"></header>
  <main id="view" tabindex="-1"><!--VIEW--></main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16M4 12h16M4 18.5h10"/></svg>
      <span>Guides</span>
    </a>
    <a href="/plan/" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="13" height="13" rx="2"/><path d="M7.5 3.5h11a2 2 0 0 1 2 2v11"/></svg>
      <span>Plan</span>
    </a>
    <a href="/topics/" data-tab="topics">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span>Topics</span>
    </a>
    <a href="/search/" data-tab="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <span>Search</span>
    </a>
    <a href="/saved/" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10v17l-5-3.6-5 3.6z"/></svg>
      <span>Saved</span>
    </a>
  </nav>

  <div class="deck" id="deck" hidden role="dialog" aria-modal="true" aria-labelledby="deck-title">
    <div class="deck-bar">
      <button type="button" class="lb-btn" data-deck="close">Close</button>
      <h2 id="deck-title"></h2>
      <span class="deck-count" id="deck-count" aria-live="polite"></span>
    </div>
    <div class="deck-track" id="deck-track" tabindex="0" aria-label="Swipe for the next image"></div>
    <div class="deck-nav">
      <button type="button" class="lb-btn" data-deck="prev" aria-label="Previous image">Previous</button>
      <button type="button" class="lb-btn" data-deck="next" aria-label="Next image">Next</button>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lightbox-bar">
      <button type="button" class="lb-btn" data-lb="zoom" aria-label="Zoom">Zoom</button>
      <button type="button" class="lb-btn" data-lb="close" aria-label="Close image">Close</button>
    </div>
    <div class="lightbox-stage" id="lightbox-stage"><img alt=""></div>
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <div class="update-bar" id="update-bar" role="status" hidden><p>A newer version of the app is ready.</p><button class="text-btn" type="button" data-action="apply-update">Update</button></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
  <!--BODY-END-->
</body>
</html>
